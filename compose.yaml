
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: rag-agent-api

    env_file:
      - .env

    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rag_active
      EMBEDDING_MODEL: BAAI/bge-m3
      CHUNK_DB: /app/data/rag_chunks.sqlite
      EMBEDDING_BATCH_SIZE: "4"
      MAX_UPLOAD_MB: "100"
      MAX_BATCH_MB: "400"
      MAX_BATCH_FILES: "12"
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./data:/app/data
      - model_cache:/app/model_cache

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s


  web:
    build:
      context: .
      dockerfile: Dockerfile.web

    container_name: rag-agent-web

    environment:
      AGENT_API_URL: http://api:8000

    ports:
      - "127.0.0.1:8501:8501"

    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_storage:/qdrant/storage

    restart: unless-stopped

volumes:
  model_cache:

  qdrant_storage:
    external: true
    name: qdrant_storage